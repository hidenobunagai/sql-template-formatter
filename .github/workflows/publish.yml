name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compile && npx --yes @vscode/vsce package && python3 scripts/verify_vsix.py
      # --skip-duplicate on both: the two registries fail independently (Open VSX
      # can return 503 while the VS Code Marketplace succeeds), and neither allows
      # republishing a version. Without the flag, re-running this job after such a
      # partial failure would stop at the already-published registry and never
      # reach the other one.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT" --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT" --skip-duplicate

  # A separate job on purpose: the two registries fail independently (a VSIX
  # version cannot be republished, while npm can be retried on the next version),
  # so "Re-run failed jobs" must be able to retry one without touching the other.
  npm:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) replaces the token: no NPM_TOKEN secret, nothing to
    # rotate or expire. Configured at
    # https://www.npmjs.com/package/sql-template-formatter/access — the workflow
    # filename below must match what is registered there ("publish.yml").
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm CLI >= 11.5.1; the runner's bundled npm is older.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      # Guards the packaging trap: `out/` is gitignored, and `files` in
      # package.json is unusable here (VSCE rejects it next to .vscodeignore),
      # so the tarball inventory depends on .npmignore alone.
      - name: Verify the npm tarball ships the CLI
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -q "out/cli.js" /tmp/npm-pack.txt
          grep -q "out/ordinals.js" /tmp/npm-pack.txt
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential when a trusted publisher matches this workflow, and adds
      # provenance attestations automatically.
      - name: Publish to npm
        run: npm publish --access public
