name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both publishing jobs wait for this one: a tag push must never ship a build
  # whose tests were not run on that exact commit, nor a version that differs
  # from the tag (a mistyped tag would otherwise burn a marketplace version).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compile
      - run: bun test

  marketplaces:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts
      # vsce and ovsx run from node_modules, pinned by bun.lock (and held to
      # bunfig.toml's minimum release age) — never fetched fresh by `npx --yes`
      # into a job that holds the marketplace tokens.
      - run: bun run compile && node_modules/.bin/vsce package && python3 scripts/verify_vsix.py
      # --skip-duplicate on both: the two registries fail independently (Open VSX
      # can return 503 while the VS Code Marketplace succeeds), and neither allows
      # republishing a version. Without the flag, re-running this job after such a
      # partial failure would stop at the already-published registry and never
      # reach the other one.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node_modules/.bin/vsce publish --packagePath *.vsix -p "$VSCE_PAT" --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # Open VSX answers 503 intermittently (three times on 2026-09-17 across two
        # repositories) and can even fail the request after accepting the upload.
        # --skip-duplicate makes the retry harmless in that case: an
        # already-published version reports success.
        run: |
          for attempt in 1 2 3 4; do
            if node_modules/.bin/ovsx publish *.vsix -p "$OVSX_PAT" --skip-duplicate; then
              exit 0
            fi
            echo "::warning::ovsx publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::ovsx publish failed after 4 attempts"
          exit 1

  # A separate job on purpose: the two registries fail independently (a VSIX
  # version cannot be republished, while npm can be retried on the next version),
  # so "Re-run failed jobs" must be able to retry one without touching the other.
  npm:
    needs: verify
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) replaces the token: no NPM_TOKEN secret, nothing to
    # rotate or expire. Configured at
    # https://www.npmjs.com/package/sql-template-formatter/access — the workflow
    # filename below must match what is registered there ("publish.yml").
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm CLI >= 11.5.1; the runner's bundled npm is
      # older. Pinned (not @latest) so a freshly published npm release never runs
      # in the publish job before it has aged like every other dependency.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.20.0
      # Guards the packaging trap: `out/` is gitignored, and `files` in
      # package.json is unusable here (VSCE rejects it next to .vscodeignore),
      # so the tarball inventory depends on .npmignore alone. The CLI is an
      # esbuild bundle with no runtime dependencies, so it must run straight
      # out of the unpacked tarball with no node_modules next to it.
      - name: Verify the npm tarball ships a working CLI
        run: |
          mkdir -p /tmp/npm-pack
          npm pack --pack-destination /tmp/npm-pack
          tar -xzf /tmp/npm-pack/*.tgz -C /tmp/npm-pack
          echo "select a from t;" | node /tmp/npm-pack/package/out/cli.js | grep -q "^SELECT$"
      # Idempotent on purpose: re-running the workflow (for example to retry the
      # marketplaces after an Open VSX 503) must not fail just because npm already
      # has this version.
      - name: Check whether this version is already on npm
        id: npm-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "sql-template-formatter@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >>"$GITHUB_OUTPUT"
            echo "sql-template-formatter@${VERSION} is already published"
          else
            echo "published=false" >>"$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential when a trusted publisher matches this workflow, and adds
      # provenance attestations automatically.
      - name: Publish to npm
        if: steps.npm-version.outputs.published == 'false'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          OUTPUT="$(npm publish --access public 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          # The guard above cannot see a version that npm has staged but not yet
          # promoted: for a few minutes after a publish the registry still answers
          # "no such version", so a second publish of it (a tag run racing a manual
          # dispatch run, as on 2026-10-09) is rejected with "Cannot publish over
          # previously staged version <v>" while the first copy is already on its
          # way to the registry. That is the idempotency the guard was meant to
          # provide, so treat it as done instead of failing the run.
          if printf '%s' "$OUTPUT" | grep -qiE 'previously (staged|published) version'; then
            echo "::notice::sql-template-formatter@${VERSION} was already staged or published; nothing to do"
            exit 0
          fi
          exit "$STATUS"
