name: CI

# Pushes to main and every pull request; a feature branch with an open PR is
# covered by the pull_request run instead of running everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun test
      # `npm publish` rewrites the manifest before uploading, and npm 11 *removes*
      # a bin entry whose path starts with "./" — which would publish a package
      # with no executable at all. Fail here instead if package.json drifts from
      # the form npm produces.
      - name: Verify package.json is publish-clean
        run: |
          npm pkg fix
          git diff --exit-code -- package.json
      - run: bun run package
